name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-backend:
    name: Run Backend Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            bugboard/backend/requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d "bugboard/backend" ]; then
            pip install -r bugboard/backend/requirements.txt
          elif [ -d "backend" ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Run Pytest Quality Gate
        run: |
          if [ -d "bugboard/backend" ]; then
            cd bugboard/backend
          elif [ -d "backend" ]; then
            cd backend
          fi
          pytest -v

  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            bugboard/frontend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies and build frontend
        run: |
          if [ -d "bugboard/frontend" ]; then
            cd bugboard/frontend
          elif [ -d "frontend" ]; then
            cd frontend
          fi
          npm ci || npm install
          npm run build

  build-and-push-images:
    name: Build & Push Docker Images to GHCR
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Resolve Context & Lowercase Repository Name
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BACKEND_TAGS="ghcr.io/${REPO_LOWER}/backend:${{ github.sha }},ghcr.io/${REPO_LOWER}/backend:latest"
          FRONTEND_TAGS="ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }},ghcr.io/${REPO_LOWER}/frontend:latest"

          if [ -n "$DOCKERHUB_USER" ]; then
            DH_USER_LOWER=$(echo "$DOCKERHUB_USER" | tr '[:upper:]' '[:lower:]')
            BACKEND_TAGS="${BACKEND_TAGS},${DH_USER_LOWER}/bugboard-backend:${{ github.sha }},${DH_USER_LOWER}/bugboard-backend:latest"
            FRONTEND_TAGS="${FRONTEND_TAGS},${DH_USER_LOWER}/bugboard-frontend:${{ github.sha }},${DH_USER_LOWER}/bugboard-frontend:latest"
          fi

          echo "backend_tags=${BACKEND_TAGS}" >> $GITHUB_OUTPUT
          echo "frontend_tags=${FRONTEND_TAGS}" >> $GITHUB_OUTPUT

          if [ -d "bugboard/backend" ]; then
            echo "backend_context=bugboard/backend" >> $GITHUB_OUTPUT
            echo "backend_dockerfile=bugboard/backend/Dockerfile" >> $GITHUB_OUTPUT
            echo "frontend_context=bugboard/frontend" >> $GITHUB_OUTPUT
            echo "frontend_dockerfile=bugboard/frontend/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "backend_context=backend" >> $GITHUB_OUTPUT
            echo "backend_dockerfile=backend/Dockerfile" >> $GITHUB_OUTPUT
            echo "frontend_context=frontend" >> $GITHUB_OUTPUT
            echo "frontend_dockerfile=frontend/Dockerfile" >> $GITHUB_OUTPUT
          fi
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.prep.outputs.backend_context }}
          file: ${{ steps.prep.outputs.backend_dockerfile }}
          push: true
          tags: ${{ steps.prep.outputs.backend_tags }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.prep.outputs.frontend_context }}
          file: ${{ steps.prep.outputs.frontend_dockerfile }}
          push: true
          tags: ${{ steps.prep.outputs.frontend_tags }}
