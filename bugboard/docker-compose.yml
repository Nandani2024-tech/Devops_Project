services:
  postgres:
    image: postgres:16-alpine
    container_name: bugboard_postgres
    environment:
      POSTGRES_USER: bugboard_user
      POSTGRES_PASSWORD: bugboard_pass
      POSTGRES_DB: bugboard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugboard_user -d bugboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bugboard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugboard_backend
    environment:
      DATABASE_URL: postgresql://bugboard_user:bugboard_pass@postgres:5432/bugboard_db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bugboard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bugboard_frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - bugboard-net

networks:
  bugboard-net:
    driver: bridge

volumes:
  postgres_data:
