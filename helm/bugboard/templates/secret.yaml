apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bugboard.fullname" . }}-secret
  labels:
    {{- include "bugboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.credentials.database | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.credentials.username }}:{{ .Values.postgres.credentials.password }}@{{ include "bugboard.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.credentials.database }}"
